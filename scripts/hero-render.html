<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Cena: fios finos desenhados um a um sobre pele creme, com profundidade de campo e luz suave.
// Determinística: window.renderFrame(t) desenha o instante t (0..10s). Loop sem emenda (começa e termina vazia).
const W = 1920, H = 1080, DUR = 10;
const c = document.getElementById("c");
const ctx = c.getContext("2d");

function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const R = rng(20241105);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOut = (x) => 1 - Math.pow(1 - x, 3.2);
const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);

// ---- Pele creme (uma vez): gradiente + manchas suaves + poros finos ----
const skin = document.createElement("canvas"); skin.width = W; skin.height = H;
(() => {
  const g = skin.getContext("2d");
  const grad = g.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, "#f1e4d4"); grad.addColorStop(0.55, "#ead9c6"); grad.addColorStop(1, "#e2cfbb");
  g.fillStyle = grad; g.fillRect(0, 0, W, H);
  const rr = rng(7);
  for (let i = 0; i < 70; i++) {
    const x = rr() * W, y = rr() * H, r = 120 + rr() * 380;
    const rg = g.createRadialGradient(x, y, 0, x, y, r);
    const warm = rr() > 0.5;
    rg.addColorStop(0, warm ? "rgba(214,160,130,0.07)" : "rgba(170,190,150,0.06)");
    rg.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = rg; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  const img = g.getImageData(0, 0, W, H); const d = img.data; const rn = rng(99);
  for (let i = 0; i < d.length; i += 4) { const n = (rn() - 0.5) * 11; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(img, 0, 0);
  // poros
  g.fillStyle = "rgba(120,80,60,0.10)";
  for (let i = 0; i < 2600; i++) { g.beginPath(); g.arc(rr() * W, rr() * H, 0.6 + rr() * 1.3, 0, 7); g.fill(); }
})();

// ---- Fios ----
const COLORS = ["#1f3a2b", "#26342a", "#33402f", "#3d3a2c", "#4a3a30", "#1c2a22"];
const strands = [];
function makeStrand(i, mass) {
  const z = R(); // 0 perto … 1 longe
  let x0, y0, ang, len;
  if (mass) {
    // massa em arco, como uma sobrancelha: cresce da esquerda (cabeça) para a direita (cauda)
    const t = R();
    const cx = 420 + t * 1100;
    const arcY = 620 - Math.sin(t * Math.PI) * 190 + t * 90;
    x0 = cx + (R() - 0.5) * 40; y0 = arcY + (R() - 0.5) * 110 * (1 - t * 0.55);
    ang = -0.75 + t * 0.95 + (R() - 0.5) * 0.35; // sobe na cabeça e desce na cauda
    len = 150 + R() * 150;
  } else {
    x0 = R() * W; y0 = R() * H; ang = (R() - 0.5) * 1.6 - 0.2; len = 260 + R() * 520;
  }
  const bend = (R() - 0.5) * (mass ? 0.9 : 1.8);
  const pts = [];
  const n = 40;
  for (let k = 0; k <= n; k++) {
    const u = k / n; const a = ang + bend * u * u;
    const px = x0 + Math.cos(ang) * len * u + Math.sin(ang) * (bend * len * u * u * 0.5);
    const py = y0 + Math.sin(ang) * len * u - Math.cos(ang) * (bend * len * u * u * 0.5);
    pts.push([px, py, a]);
  }
  const start = mass ? 0.25 + (x0 / W) * 5.4 + R() * 0.9 : 0.4 + R() * 6.2;
  strands.push({
    pts, z, w: mass ? 2.6 + R() * 2.6 : 1.6 + R() * 1.6, op: 0.55 + R() * 0.4,
    col: COLORS[(R() * COLORS.length) | 0], start, dur: 1.3 + R() * 1.4, fade: 8.2 + R() * 1.5,
    sheen: R() * Math.PI * 2,
  });
}
for (let i = 0; i < 240; i++) makeStrand(i, true);
for (let i = 0; i < 26; i++) makeStrand(i, false);

// ---- Camadas (profundidade de campo): perto / foco / longe ----
const layers = [0, 1, 2].map(() => { const k = document.createElement("canvas"); k.width = W; k.height = H; return k; });

function drawStrand(g, s, t, ox, oy) {
  const age = clamp((t - s.start) / s.dur);
  if (age <= 0) return;
  const p = easeOut(age);
  const fade = 1 - easeInOut(clamp((t - s.fade) / (DUR - s.fade)));
  if (fade <= 0) return;
  const n = Math.max(2, Math.floor(p * (s.pts.length - 1)));
  // polígono afinado (um preenchimento só: sem emendas nem pontilhado)
  const L = [], Rr = [];
  for (let k = 0; k <= n; k++) {
    const a = s.pts[Math.max(0, k - 1)], b = s.pts[Math.min(s.pts.length - 1, k + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;
    const u = k / (s.pts.length - 1);
    const w = Math.max(0.3, s.w * (1 - 0.9 * u) * (0.6 + 0.4 * (1 - s.z))) / 2;
    L.push([s.pts[k][0] + ox - dy * w, s.pts[k][1] + oy + dx * w]);
    Rr.push([s.pts[k][0] + ox + dy * w, s.pts[k][1] + oy - dx * w]);
  }
  g.beginPath(); g.moveTo(L[0][0], L[0][1]);
  for (let k = 1; k < L.length; k++) g.lineTo(L[k][0], L[k][1]);
  for (let k = Rr.length - 1; k >= 0; k--) g.lineTo(Rr[k][0], Rr[k][1]);
  g.closePath(); g.fillStyle = s.col; g.globalAlpha = s.op * fade; g.fill();
  // fio de luz sobre o fio (brilho suave, desloca com o tempo)
  const hl = 0.5 + 0.5 * Math.sin(s.sheen + t * 1.3);
  g.strokeStyle = "#f4ece3"; g.globalAlpha = 0.16 * hl * fade * (1 - s.z); g.lineWidth = 0.5;
  g.beginPath(); g.moveTo(L[0][0], L[0][1]); for (let k = 1; k < L.length; k++) g.lineTo(L[k][0], L[k][1]); g.stroke();
  if (age < 1) { const q = s.pts[n]; g.globalAlpha = 0.6 * fade * (1 - age); g.fillStyle = "#f4ece3"; g.beginPath(); g.arc(q[0] + ox, q[1] + oy, 1.7, 0, 7); g.fill(); }
  g.globalAlpha = 1;
}

window.renderFrame = (t) => {
  // 1) pele com leve deriva de câmera
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.filter = "none"; ctx.globalAlpha = 1;
  const drift = Math.sin((t / DUR) * Math.PI * 2);
  ctx.drawImage(skin, -20 + drift * 10, -12 + drift * 6, W + 40, H + 24);

  // 2) fios por camada, com paralaxe
  const focus = 0.5 + 0.18 * Math.sin((t / DUR) * Math.PI * 2 + 0.6); // plano de foco desliza
  layers.forEach((L) => { const g = L.getContext("2d"); g.clearRect(0, 0, W, H); });
  for (const s of strands) {
    const zi = s.z < focus - 0.17 ? 0 : s.z > focus + 0.17 ? 2 : 1;
    const par = (s.z - 0.5) * 26 * drift;
    drawStrand(layers[zi].getContext("2d"), s, t, par, par * 0.4);
  }
  const blurs = [9, 0, 6];
  layers.forEach((L, i) => {
    ctx.filter = blurs[i] ? `blur(${blurs[i]}px)` : "none";
    ctx.drawImage(L, 0, 0);
  });
  ctx.filter = "none";

  // 3) luz suave: brilho que atravessa a cena + vinheta quente
  const lx = -300 + ((t % DUR) / DUR) * (W + 600);
  const lg = ctx.createRadialGradient(lx, 380, 0, lx, 380, 760);
  lg.addColorStop(0, "rgba(255,244,228,0.34)"); lg.addColorStop(1, "rgba(255,244,228,0)");
  ctx.globalCompositeOperation = "soft-light"; ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = "source-over";
  const vg = ctx.createRadialGradient(W * 0.55, H * 0.5, H * 0.35, W * 0.55, H * 0.5, W * 0.85);
  vg.addColorStop(0, "rgba(31,58,43,0)"); vg.addColorStop(1, "rgba(31,58,43,0.28)");
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  // grão
  ctx.globalAlpha = 0.05; ctx.fillStyle = "#fff";
  for (let i = 0; i < 700; i++) ctx.fillRect(((i * 9301 + Math.floor(t * 30) * 4973) % W), ((i * 49297 + Math.floor(t * 30) * 233) % H), 1.4, 1.4);
  ctx.globalAlpha = 1;
};
window.renderFrame(0);
window.__ready = true;
</script>
